name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the checked-out tree.
permissions:
  contents: read

# Cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint Markdown, JSON, and shell. Reuses `make lint` so the lint definition
  # lives in one place (the Makefile). markdownlint runs via npx (no global
  # install needed); shellcheck and jq are pre-installed on ubuntu-latest.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No git operations after checkout, so don't leave the job token in
          # .git/config where a later third-party step could read it.
          persist-credentials: false

      - name: Lint (markdownlint, jq, shellcheck)
        run: make lint MARKDOWNLINT='npx --yes markdownlint-cli2'

  # Test the wrapper's dispatch against a fake sbx CLI on PATH — no real
  # sandbox, no Docker, no network.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test wrapper
        run: make test-unit

  # Validate sbxclaude/spec.yaml against the current Sandbox Kit schema.
  # Static check — no Docker or login; only the CLI download needs the
  # network. Install steps mirror docker/sbx-kits-contrib's
  # .github/workflows/e2e.yml.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Install the latest sbx CLI. "latest" is intentional: the schema is
      # bundled in the binary, so this surfaces schema drift as soon as it
      # ships.
      - name: Install sbx CLI
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/docker/sbx-releases/releases/latest/download/DockerSandboxes-linux.tar.gz" \
            -o /tmp/DockerSandboxes-linux.tar.gz
          tar xzf /tmp/DockerSandboxes-linux.tar.gz -C /tmp
          sudo PREFIX="${HOME}/.docker/sbx" /tmp/docker-sbx/install.sh
          echo "${HOME}/.docker/sbx/bin" >> "$GITHUB_PATH"

      - name: Verify sbx
        run: sbx version

      - name: Validate kit spec
        run: make validate
